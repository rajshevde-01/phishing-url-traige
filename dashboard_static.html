<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phishing URL Triage Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #111827;
      --card: #0b1220;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.25);
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #f97316;
    }
    body {
      margin: 0;
      font-family: "Space Grotesk", "Trebuchet MS", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, var(--bg) 55%, #0b1020 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(0px);
      opacity: 0.35;
      z-index: -1;
      animation: float 16s ease-in-out infinite;
    }
    .orb-1 {
      width: 320px;
      height: 320px;
      top: -80px;
      right: 10%;
      background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.6), rgba(15, 23, 42, 0));
      animation-delay: 0s;
    }
    .orb-2 {
      width: 260px;
      height: 260px;
      bottom: -60px;
      left: 8%;
      background: radial-gradient(circle at 30% 30%, rgba(34, 197, 94, 0.5), rgba(15, 23, 42, 0));
      animation-delay: 2s;
    }
    .orb-3 {
      width: 220px;
      height: 220px;
      top: 45%;
      left: 55%;
      background: radial-gradient(circle at 30% 30%, rgba(249, 115, 22, 0.45), rgba(15, 23, 42, 0));
      animation-delay: 4s;
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-20px) translateX(10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    header {
      padding: 28px 24px 8px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0.4px;
    }
    p {
      margin: 4px 0;
      color: var(--muted);
    }
    .container {
      padding: 0 24px 24px;
    }
    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.35);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    .control-block label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="file"],
    textarea,
    select,
    input[type="text"],
    input[type="range"] {
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
    }
    input[type="range"] {
      padding: 6px 0;
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button {
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: #0b1020;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button.secondary {
      background: linear-gradient(135deg, var(--accent-2), #16a34a);
    }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.35);
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 12px 0 20px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 20px; font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 16px 32px rgba(8, 12, 20, 0.35);
    }
    .card h3 {
      margin-top: 0;
      margin-bottom: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: rgba(148, 163, 184, 0.1);
    }
    .status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.2px;
    }
    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <header>
    <h1>Phishing URL Triage Dashboard</h1>
    <p>Load a report CSV or paste URLs to score and visualize risk distribution.</p>
  </header>

  <div class="container">
    <div class="controls">
      <div class="controls-grid">
        <div class="control-block">
          <label for="fileInput">Load CSV (report or url-only)</label>
          <input type="file" id="fileInput" accept=".csv,.txt" />
        </div>
        <div class="control-block">
          <label for="riskFilter">Risk filter</label>
          <select id="riskFilter">
            <option value="all">All</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="control-block">
          <label for="minScore">Minimum score <span class="pill" id="minScoreValue">0</span></label>
          <input type="range" id="minScore" min="0" max="80" step="5" value="0" />
        </div>
        <div class="control-block">
          <label for="searchBox">Search URL or signal</label>
          <input type="text" id="searchBox" placeholder="paypal, verify, 192.168" />
        </div>
      </div>
      <div style="margin-top: 12px;">
        <label for="urlInput"><strong>Paste URLs (one per line)</strong></label>
        <textarea id="urlInput" rows="6" style="margin-top: 6px;"></textarea>
      </div>
      <div class="button-row">
        <button id="scoreUrls">Score URLs</button>
        <button id="downloadCsv" class="secondary">Download CSV</button>
        <button id="clearAll" class="ghost">Clear</button>
      </div>
      <div class="status" id="status">No data loaded.</div>
    </div>

    <div class="kpis" id="kpis">
      <div class="kpi"><div class="label">Total</div><div class="value" id="kpi-total">0</div></div>
      <div class="kpi"><div class="label">High</div><div class="value" id="kpi-high">0</div></div>
      <div class="kpi"><div class="label">Medium</div><div class="value" id="kpi-medium">0</div></div>
      <div class="kpi"><div class="label">Low</div><div class="value" id="kpi-low">0</div></div>
      <div class="kpi"><div class="label">Avg Score</div><div class="value" id="kpi-avg">0</div></div>
    </div>

    <div class="grid">
      <div class="card">
        <canvas id="riskBar"></canvas>
      </div>
      <div class="card">
        <canvas id="riskPie"></canvas>
      </div>
      <div class="card">
        <canvas id="signalsBar"></canvas>
      </div>
      <div class="card">
        <h3>Top 10 Highest Scores</h3>
        <table>
          <thead>
            <tr>
              <th>URL</th>
              <th>Score</th>
              <th>Risk</th>
              <th>Signals</th>
            </tr>
          </thead>
          <tbody id="topTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");

    let riskBarChart;
    let riskPieChart;
    let signalsBarChart;
    let currentRows = [];
    let filteredRows = [];

    const riskFilter = document.getElementById("riskFilter");
    const minScoreInput = document.getElementById("minScore");
    const minScoreValue = document.getElementById("minScoreValue");
    const searchBox = document.getElementById("searchBox");

    const suspiciousKeywords = new Set([
      "login",
      "verify",
      "account",
      "update",
      "secure",
      "bank",
      "password",
      "confirm",
      "billing",
      "pay",
      "payment",
      "webscr",
      "alert",
      "security",
      "support",
      "icloud",
      "microsoft",
      "google",
      "paypal",
    ]);

    const suspiciousTlds = new Set([
      "zip",
      "mov",
      "click",
      "link",
      "top",
      "xyz",
      "gq",
      "tk",
      "ml",
      "cf",
      "ru",
      "cn",
    ]);

    const ipInUrlRe = /https?:\/\/(\d{1,3}\.){3}\d{1,3}(\/|$)/i;

    function parseCsv(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim() !== "");
      if (lines.length === 0) return [];
      const headers = splitCsvLine(lines[0]);
      return lines.slice(1).map((line) => {
        const values = splitCsvLine(line);
        const row = {};
        headers.forEach((h, i) => {
          row[h] = values[i] ?? "";
        });
        return row;
      });
    }

    function shannonEntropy(value) {
      if (!value) return 0;
      const freq = {};
      for (const ch of value) {
        freq[ch] = (freq[ch] || 0) + 1;
      }
      const len = value.length;
      let entropy = 0;
      Object.values(freq).forEach((count) => {
        const p = count / len;
        entropy -= p * Math.log2(p);
      });
      return entropy;
    }

    function extractDomainParts(hostname) {
      if (!hostname) return { domain: "", tld: "" };
      const parts = hostname.split(".");
      if (parts.length < 2) return { domain: hostname, tld: "" };
      return { domain: parts.slice(0, -1).join("."), tld: parts[parts.length - 1] };
    }

    function triageUrl(url) {
      const signals = [];
      let score = 0;

      let parsed;
      const hadScheme = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url);
      try {
        parsed = new URL(url);
      } catch (err) {
        if (!hadScheme) {
          try {
            parsed = new URL("http://" + url);
          } catch (err2) {
            parsed = null;
          }
        } else {
          parsed = null;
        }
      }

      const hostname = parsed ? parsed.hostname.toLowerCase() : "";
      const pathname = parsed ? parsed.pathname.toLowerCase() : "";
      const full = `${hostname}${pathname}`;

      if (!hadScheme || !hostname) {
        signals.push({ name: "invalid_url", score: 15, detail: "Missing scheme or hostname" });
        score += 15;
      }

      if (ipInUrlRe.test(url)) {
        signals.push({ name: "ip_in_url", score: 25, detail: "IP address used instead of domain" });
        score += 25;
      }

      if (hostname.includes("xn--")) {
        signals.push({ name: "punycode", score: 20, detail: "Punycode domain detected" });
        score += 20;
      }

      const keywordHits = [];
      suspiciousKeywords.forEach((keyword) => {
        if (full.includes(keyword)) keywordHits.push(keyword);
      });
      if (keywordHits.length) {
        const hitScore = Math.min(25, 5 * keywordHits.length);
        signals.push({
          name: "keywords",
          score: hitScore,
          detail: `Keywords: ${keywordHits.sort().join(", ")}`,
        });
        score += hitScore;
      }

      const { domain, tld } = extractDomainParts(hostname);
      if (tld && suspiciousTlds.has(tld)) {
        signals.push({ name: "suspicious_tld", score: 15, detail: `TLD: .${tld}` });
        score += 15;
      }

      if (url.length > 75) {
        signals.push({ name: "long_url", score: 10, detail: `Length: ${url.length}` });
        score += 10;
      }

      if (domain) {
        const entropy = shannonEntropy(domain);
        if (entropy >= 3.6) {
          signals.push({ name: "high_entropy", score: 10, detail: `Entropy: ${entropy.toFixed(2)}` });
          score += 10;
        }
      }

      if (url.includes("@")) {
        signals.push({ name: "at_symbol", score: 10, detail: "@ in URL can hide true domain" });
        score += 10;
      }

      if (hadScheme && url.toLowerCase().startsWith("http://")) {
        signals.push({ name: "http", score: 5, detail: "HTTP used instead of HTTPS" });
        score += 5;
      }

      let risk = "low";
      if (score >= 40) risk = "high";
      else if (score >= 20) risk = "medium";

      return {
        url,
        score,
        risk,
        signals: signals.map((item) => `${item.name}:${item.detail}`).join("; "),
      };
    }

    function ensureScored(rows) {
      if (!rows.length) return [];
      const hasScores =
        Object.prototype.hasOwnProperty.call(rows[0], "score") &&
        Object.prototype.hasOwnProperty.call(rows[0], "risk") &&
        Object.prototype.hasOwnProperty.call(rows[0], "signals");

      if (hasScores) return rows;
      return rows
        .map((row) => (row.url ? triageUrl(row.url) : null))
        .filter((row) => row !== null);
    }

    function splitCsvLine(line) {
      const out = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          out.push(current);
          current = "";
        } else {
          current += ch;
        }
      }
      out.push(current);
      return out.map((v) => v.trim());
    }

    function aggregate(data) {
      const riskCounts = {};
      const signalCounts = {};
      let totalScore = 0;

      data.forEach((row) => {
        const risk = (row.risk || "unknown").toLowerCase();
        const score = Number(row.score || 0);
        const signals = row.signals || "";

        riskCounts[risk] = (riskCounts[risk] || 0) + 1;
        totalScore += score;

        signals.split(";").forEach((chunk) => {
          const trimmed = chunk.trim();
          if (!trimmed) return;
          const name = trimmed.split(":")[0].trim();
          if (!name) return;
          signalCounts[name] = (signalCounts[name] || 0) + 1;
        });
      });

      const avgScore = data.length ? (totalScore / data.length) : 0;
      return { riskCounts, signalCounts, avgScore };
    }

    function updateKpis(data, avgScore) {
      const riskCounts = data.reduce((acc, row) => {
        const risk = (row.risk || "unknown").toLowerCase();
        acc[risk] = (acc[risk] || 0) + 1;
        return acc;
      }, {});

      document.getElementById("kpi-total").textContent = data.length;
      document.getElementById("kpi-high").textContent = riskCounts.high || 0;
      document.getElementById("kpi-medium").textContent = riskCounts.medium || 0;
      document.getElementById("kpi-low").textContent = riskCounts.low || 0;
      document.getElementById("kpi-avg").textContent = avgScore.toFixed(2);
    }

    function updateTable(data) {
      const tbody = document.getElementById("topTable");
      tbody.innerHTML = "";
      const top = [...data]
        .sort((a, b) => Number(b.score || 0) - Number(a.score || 0))
        .slice(0, 10);

      top.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.url || ""}</td>
          <td>${row.score || ""}</td>
          <td>${row.risk || ""}</td>
          <td>${row.signals || ""}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function drawCharts(riskCounts, signalCounts) {
      const riskLabels = Object.keys(riskCounts);
      const riskValues = Object.values(riskCounts);

      const signalEntries = Object.entries(signalCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      const signalLabels = signalEntries.map((item) => item[0]);
      const signalValues = signalEntries.map((item) => item[1]);

      if (riskBarChart) riskBarChart.destroy();
      if (riskPieChart) riskPieChart.destroy();
      if (signalsBarChart) signalsBarChart.destroy();

      riskBarChart = new Chart(document.getElementById("riskBar"), {
        type: "bar",
        data: { labels: riskLabels, datasets: [{ label: "Count", data: riskValues }] },
        options: { plugins: { title: { display: true, text: "Risk Distribution (Bar)" } } },
      });

      riskPieChart = new Chart(document.getElementById("riskPie"), {
        type: "pie",
        data: { labels: riskLabels, datasets: [{ data: riskValues }] },
        options: { plugins: { title: { display: true, text: "Risk Distribution (Pie)" } } },
      });

      signalsBarChart = new Chart(document.getElementById("signalsBar"), {
        type: "bar",
        data: {
          labels: signalLabels.length ? signalLabels : ["none"],
          datasets: [{ label: "Count", data: signalValues.length ? signalValues : [0] }],
        },
        options: { plugins: { title: { display: true, text: "Top Signals" } } },
      });
    }

    function applyFilters() {
      const selectedRisk = riskFilter.value;
      const minScore = Number(minScoreInput.value || 0);
      const query = searchBox.value.trim().toLowerCase();

      filteredRows = currentRows.filter((row) => {
        const risk = (row.risk || "").toLowerCase();
        const score = Number(row.score || 0);
        const haystack = `${row.url || ""} ${row.signals || ""}`.toLowerCase();

        if (selectedRisk !== "all" && risk !== selectedRisk) return false;
        if (score < minScore) return false;
        if (query && !haystack.includes(query)) return false;
        return true;
      });

      const { riskCounts, signalCounts, avgScore } = aggregate(filteredRows);
      updateKpis(filteredRows, avgScore);
      updateTable(filteredRows);
      drawCharts(riskCounts, signalCounts);
      statusEl.textContent = `Showing ${filteredRows.length} of ${currentRows.length} rows.`;
    }

    function applyRows(rows, sourceLabel) {
      if (!rows.length) {
        statusEl.textContent = "No rows found.";
        return;
      }

      currentRows = ensureScored(rows);
      filteredRows = currentRows;
      minScoreInput.value = "0";
      minScoreValue.textContent = "0";
      searchBox.value = "";
      riskFilter.value = "all";
      const { riskCounts, signalCounts, avgScore } = aggregate(currentRows);
      updateKpis(currentRows, avgScore);
      updateTable(currentRows);
      drawCharts(riskCounts, signalCounts);
      statusEl.textContent = `Loaded ${currentRows.length} rows${sourceLabel ? " from " + sourceLabel : ""}.`;
    }

    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const rawText = reader.result;
        const rows = parseCsv(rawText);
        if (rows.length && Object.prototype.hasOwnProperty.call(rows[0], "url")) {
          applyRows(rows, file.name);
          return;
        }

        const lines = rawText
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line !== "");
        const urlRows = lines.map((line) => ({ url: line }));
        applyRows(urlRows, file.name);
      };
      reader.readAsText(file);
    });

    document.getElementById("scoreUrls").addEventListener("click", () => {
      const input = document.getElementById("urlInput").value;
      const urls = input
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line !== "");
      if (!urls.length) {
        statusEl.textContent = "Paste at least one URL.";
        return;
      }
      const urlRows = urls.map((line) => ({ url: line }));
      applyRows(urlRows, "pasted URLs");
    });

    document.getElementById("downloadCsv").addEventListener("click", () => {
      if (!filteredRows.length) {
        statusEl.textContent = "No data to export.";
        return;
      }

      const headers = ["url", "score", "risk", "signals"];
      const lines = [headers.join(",")];
      filteredRows.forEach((row) => {
        const values = headers.map((key) => {
          const raw = row[key] ?? "";
          const escaped = String(raw).replace(/"/g, '""');
          return `"${escaped}"`;
        });
        lines.push(values.join(","));
      });

      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "triage_report.csv";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      currentRows = [];
      filteredRows = [];
      document.getElementById("urlInput").value = "";
      searchBox.value = "";
      minScoreInput.value = "0";
      minScoreValue.textContent = "0";
      riskFilter.value = "all";
      updateKpis([], 0);
      updateTable([]);
      drawCharts({}, {});
      statusEl.textContent = "Cleared.";
    });

    minScoreInput.addEventListener("input", () => {
      minScoreValue.textContent = minScoreInput.value;
      if (currentRows.length) applyFilters();
    });

    riskFilter.addEventListener("change", () => {
      if (currentRows.length) applyFilters();
    });

    searchBox.addEventListener("input", () => {
      if (currentRows.length) applyFilters();
    });
  </script>
</body>
</html>
